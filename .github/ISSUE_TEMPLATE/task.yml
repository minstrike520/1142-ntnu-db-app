name: Task & Proposal (功能開發與技術提案)
description: Propose a new feature, refactoring, or track a developer task
title: "[Task/Proposal] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Please fill out this form to track new feature development, refactoring, optimization, or developer tasks.

  - type: dropdown
    id: category
    attributes:
      label: 1. Category (類別)
      options:
        - New Feature Proposal
        - Technical Modification / Refactoring
        - Performance / Security Optimization
        - General Development Task
        - Other
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: 2. Affected Components (影響範圍)
      description: Select the components affected by this task.
      options:
        - label: Frontend (Next.js)
        - label: Backend (Express / Socket.IO)
        - label: Database (PostgreSQL / Migrations)
        - label: Shared (Types & Models)
        - label: Docs / DevOps / Docker
    validations:
      required: true

  - type: textarea
    id: background
    attributes:
      label: 3. Background & Motivation (背景與動機)
      description: Explain the goal of this task and the core problem it solves.
      placeholder: e.g., In order to support the new database design, we need to adapt and map old fields in the API response...
    validations:
      required: true

  - type: textarea
    id: work_items
    attributes:
      label: 4. Work Items & Proposed Implementation (工作項目與建議實作方式)
      description: List the subtasks to be completed or describe the proposed implementation steps (optional).
      placeholder: |
        - [ ] Refactor backend controller logic
        - [ ] Update unit and integration tests
    validations:
      required: false

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: 5. Acceptance Criteria (驗收標準)
      description: Define the clear conditions of satisfaction (optional).
      placeholder: e.g., All tests pass, API response matches the frontend schema.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 6. Checks (確認事項)
      options:
        - label: I confirm this is a task or enhancement proposal, not a bug report.
          required: true
        - label: I have searched existing issues to ensure this is not a duplicate.
          required: true

  - type: input
    id: related_issues
    attributes:
      label: 7. Related Issues / PRs (相關 Issue 或 PR)
      description: Link any relevant issues or pull requests (optional).
      placeholder: "#123"
