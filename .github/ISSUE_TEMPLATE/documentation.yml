name: Documentation (文件編修)
description: Report documentation issues or suggest improvements
title: "[Docs] "
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        Help us improve our documentation by filling out the details below.

  - type: dropdown
    id: doc_type
    attributes:
      label: 1. Document Type (文件類別)
      options:
        - API Documentation
        - Database Design / Schema
        - Development / Setup Guide
        - README / General Docs
        - Other
    validations:
      required: true

  - type: textarea
    id: doc_location
    attributes:
      label: 2. Location & Description (相關文件與問題描述)
      description: Specify the document, section, and describe the issue or missing content.
      placeholder: e.g., In docs/api-documentation.md, the /api/rooms routing example has a typo in field names.
    validations:
      required: true

  - type: textarea
    id: proposed_change
    attributes:
      label: 3. Proposed Changes (建議修改內容)
      description: Detail how this document should be updated or provide the suggested text (optional).
      placeholder: e.g., Update the room type description to "group" | "private".
    validations:
      required: false
