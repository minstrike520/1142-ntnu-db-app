name: Bug Report (錯誤提報)
description: Report a bug or unexpected behavior
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please provide the following information to help us reproduce and resolve the issue.

  - type: checkboxes
    id: scope
    attributes:
      label: 1. Affected Components (影響範圍)
      description: Select the components affected by this bug.
      options:
        - label: Frontend (Next.js)
        - label: Backend (Express / Socket.IO)
        - label: Database (PostgreSQL / Migrations)
        - label: Shared (Types & Models)
        - label: Docs / DevOps / Docker
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 2. Description (問題描述)
      description: Provide a clear and concise description of the bug.
      placeholder: e.g., Application crashes and shows a white screen when clicking the group avatar.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 3. Steps to Reproduce (重現步驟)
      description: Provide step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Log in and click any chat room
        2. Click the settings icon in the top right
        3. Click the group members list
    validations:
      required: true

  - type: textarea
    id: behavior_diff
    attributes:
      label: 4. Expected vs Actual Behavior (預期與實際行為)
      description: What did you expect to happen, and what actually happened? (optional)
      placeholder: e.g., Expected to see the member list, but the app froze and showed an undefined error in console.
    validations:
      required: false

  - type: textarea
    id: environment_logs
    attributes:
      label: 5. Environment & Logs (測試環境與錯誤日誌)
      description: OS, browser version, or Docker container logs (optional).
      placeholder: e.g., macOS Chrome 126, backend Docker logs: "Connection pool exhausted..."
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 6. Checks (確認事項)
      options:
        - label: I confirm this issue exists on the latest main branch.
          required: true
        - label: I have provided reproduction steps and sufficient log/error details.
          required: true
