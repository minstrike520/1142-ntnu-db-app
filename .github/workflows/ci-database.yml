name: CI Database

on:
  workflow_call:

permissions:
  contents: read

jobs:
  # Runs backend integration and E2E test suites against live PostgreSQL and Redis services.
  database-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ntnu_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ntnu_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6385:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5433/ntnu_test
      REDIS_URL_TEST: redis://localhost:6385
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
        with:
          package: near-chat-backend
          bun: 'true'
      - run: DATABASE_URL=$DATABASE_URL_TEST pnpm --filter near-chat-backend migrate:up
      - run: pnpm --filter near-chat-backend test:integration
      - run: pnpm --filter near-chat-backend test:e2e
      - name: Output database tests summary
        run: |
          echo "### 🗄️ Database & Service Integration Tests Passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- PostgreSQL: \`postgres:18-alpine\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Redis: \`redis:8-alpine\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Executed: \`migrate:up\`, \`test:integration\`, \`test:e2e\`" >> "$GITHUB_STEP_SUMMARY"
