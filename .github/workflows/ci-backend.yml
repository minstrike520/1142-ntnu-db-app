name: CI Backend

on:
  workflow_call:
    inputs:
      run-build:
        description: Run the TypeScript production build job
        # No default on purpose: a caller that forgets to pass this should fail
        # loudly rather than silently degrade into never building.
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  # Runs eslint and TypeScript type checking.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup-workspace
        with:
          package: near-chat-backend
          bun: 'true'
      - run: pnpm --filter near-chat-backend lint

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup-workspace
        with:
          package: near-chat-backend
          bun: 'true'
      - run: pnpm --filter near-chat-backend test:unit

  build:
    if: inputs.run-build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup-workspace
        with:
          package: near-chat-backend
          bun: 'true'
      - run: pnpm --filter near-chat-backend build

  # Verifies release compose setup and graceful shutdown on the production Docker image.
  release-compose:
    name: release compose boots on the production image
    if: inputs.run-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-workspace
        with:
          package: near-chat-backend
          bun: 'true'

      # Build production backend image without layer caching to detect drift.
      - name: Build the production backend image
        run: docker build -f backend/Dockerfile.prod -t near-chat-backend:ci .

      # Temporary environment configuration for release compose stack.
      - name: Write a throwaway release env file
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release.env" <<'EOF'
          BACKEND_IMAGE=near-chat-backend:ci
          FRONTEND_IMAGE=frontend-is-not-started-in-this-job
          POSTGRES_USER=near
          POSTGRES_PASSWORD=near
          POSTGRES_DB=near_chat
          DATABASE_URL=postgresql://near:near@db:5432/near_chat
          JWT_SECRET=ci-only-value-not-a-real-secret
          CORS_ORIGINS=http://localhost:3005
          EOF

      - name: Start db, migrate and backend from the release compose
        run: |
          set -euo pipefail
          docker compose --env-file "$RUNNER_TEMP/release.env" \
            -f docker-compose.release.yml up -d db migrate backend

      - name: Assert the migrate service exited cleanly
        run: |
          set -euo pipefail
          container="$(docker compose --env-file "$RUNNER_TEMP/release.env" \
            -f docker-compose.release.yml ps -aq migrate)"
          exit_code="$(docker inspect -f '{{.State.ExitCode}}' "$container")"
          echo "migrate exit code: $exit_code"
          [[ "$exit_code" == "0" ]]

      # docker-compose.release.yml overrides the backend command, so until issue
      # #586 nothing here — or anywhere — ran the image's *own* CMD. That is the
      # command docker-compose.prod.yml inherits, and it left dash at PID 1,
      # where the kernel discards SIGTERM: `docker stop` was a no-op that ended
      # Verify that SIGTERM initiates graceful drain rather than abrupt termination.
      - name: Assert SIGTERM drains the backend instead of SIGKILLing it
        run: |
          set -euo pipefail
          net="$(docker inspect -f '{{range $k, $v := .NetworkSettings.Networks}}{{$k}}{{end}}' \
            "$(docker compose --env-file "$RUNNER_TEMP/release.env" \
              -f docker-compose.release.yml ps -q db)")"

          probe () {
            local name="$1"; shift
            echo "::group::SIGTERM probe: ${name} [$*]"
            docker run -d --name "$name" --network "$net" \
              -e DATABASE_URL=postgresql://near:near@db:5432/near_chat \
              -e JWT_SECRET=ci-only-value-not-a-real-secret \
              -e CORS_ORIGINS=http://localhost:3005 \
              near-chat-backend:ci "$@" >/dev/null

            local ready=0
            for _ in $(seq 60); do
              if docker logs "$name" 2>&1 | grep -q 'successfully listening'; then ready=1; break; fi
              sleep 1
            done
            if [[ "$ready" != 1 ]]; then
              echo "::endgroup::"
              echo "::error::${name} never started listening, so its SIGTERM behaviour could not be tested"
              docker logs "$name" 2>&1 | tail -50
              return 1
            fi

            local start=$SECONDS
            docker stop -t 30 "$name" >/dev/null
            local elapsed=$(( SECONDS - start ))
            local code logs
            code="$(docker inspect -f '{{.State.ExitCode}}' "$name")"
            logs="$(docker logs "$name" 2>&1)"
            echo "exit code ${code} after ${elapsed}s"
            echo "::endgroup::"

            local drained=0
            grep -q 'Realtime server shutting down' <<<"$logs" && drained=1

            if [[ "$code" != 0 ]]; then
              if [[ "$drained" == 1 ]]; then
                echo "::error::${name} entered its drain but exited ${code}: the drain outlived stop_grace_period"
              elif [[ "$code" == 137 ]]; then
                echo "::error::${name} exited 137: SIGTERM never reached the application and it was SIGKILLed."
              else
                echo "::error::${name} exited ${code}: a shell or init took SIGTERM and the application never saw it"
              fi
              tail -50 <<<"$logs"
              return 1
            fi

            if [[ "$drained" != 1 ]]; then
              echo "::error::${name} exited 0 without logging its shutdown, so the drain did not run"
              tail -50 <<<"$logs"
              return 1
            fi

            if (( elapsed > 20 )); then
              echo "::error::${name} took ${elapsed}s to stop; the drain is not exiting on its own"
              return 1
            fi
          }

          probe sigterm-probe-image-cmd
          probe sigterm-probe-release-cmd bun src/index.ts

      - name: Remove the SIGTERM probe containers
        if: always()
        run: docker rm -f sigterm-probe-image-cmd sigterm-probe-release-cmd >/dev/null 2>&1 || true

      - name: Assert the backend serves HTTP
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if curl -sS --max-time 5 -o /dev/null -D "$RUNNER_TEMP/probe.headers" \
              http://localhost:4005/api/v1/ci-startup-probe 2>/dev/null \
              && grep -qi '^content-security-policy:' "$RUNNER_TEMP/probe.headers"; then
              echo "backend answered on attempt ${attempt}:"
              cat "$RUNNER_TEMP/probe.headers"
              exit 0
            fi
            sleep 1
          done
          echo "::error::backend did not serve an HTTP response on :4005 within 30s"
          exit 1

      # Run realtime smoke test suite against running container.
      - name: Run the realtime smoke suite against the production image
        env:
          SMOKE_API_URL: http://localhost:4005
          SMOKE_STATE_FILE: ${{ runner.temp }}/smoke-state.json
        run: cd backend && bun run smoke

      - name: Gracefully restart the backend container
        run: |
          set -euo pipefail
          docker compose --env-file "$RUNNER_TEMP/release.env" \
            -f docker-compose.release.yml restart backend

      - name: Wait for the backend to answer again after restart
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if curl -sS --max-time 5 -o /dev/null "http://localhost:4005/api/v1/health" 2>/dev/null; then
              echo "backend answered again on attempt ${attempt}"
              exit 0
            fi
            sleep 1
          done
          echo "::error::backend did not recover on :4005 within 30s of a graceful restart" >&2
          exit 1

      - name: Re-run the realtime smoke suite after the restart
        env:
          SMOKE_API_URL: http://localhost:4005
          SMOKE_STATE_FILE: ${{ runner.temp }}/smoke-state.json
        run: cd backend && bun run smoke

      # Verify idempotency of migration and compose setup on upgrade.
      - name: Assert re-applying the bundle is a no-op
        run: |
          set -euo pipefail
          docker compose --env-file "$RUNNER_TEMP/release.env" \
            -f docker-compose.release.yml up -d db migrate backend

      - name: Output release compose smoke summary
        run: |
          echo "### 🐳 Release Compose Smoke Passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`near-chat-backend:ci\` (production build)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Health check, SIGTERM drain, and realtime smoke suite verified." >> "$GITHUB_STEP_SUMMARY"

      - name: Collect service logs
        if: failure()
        run: |
          docker compose --env-file "$RUNNER_TEMP/release.env" \
            -f docker-compose.release.yml logs --no-color db migrate backend

      - name: Tear the stack down
        if: always()
        run: |
          docker compose --env-file "$RUNNER_TEMP/release.env" \
            -f docker-compose.release.yml down -v --remove-orphans

  # Verifies that development compose stack boots and passes the realtime smoke suite.
  dev-compose-smoke:
    name: dev compose boots on the development image
    if: inputs.run-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-workspace
        with:
          package: near-chat-backend
          bun: 'true'

      - name: Write a throwaway dev env file
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/dev.env" <<'EOF'
          NODE_ENV=development
          POSTGRES_USER=near
          POSTGRES_PASSWORD=near
          POSTGRES_DB=near_chat
          DATABASE_URL=postgresql://near:near@db:5432/near_chat
          PORT=4000
          JWT_SECRET=ci-only-value-not-a-real-secret
          JWT_EXPIRES_IN=15m
          CORS_ORIGINS=http://localhost:3005
          RATE_LIMIT_DISABLED=false
          EOF

      - name: Build and start db, redis and backend from the dev compose
        run: |
          set -euo pipefail
          docker compose --env-file "$RUNNER_TEMP/dev.env" \
            -f docker-compose.yml up -d --build --wait --wait-timeout 300 db redis backend

      - name: Assert the backend is reachable on the published port
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if curl -sS --max-time 5 -o /dev/null "http://localhost:4005/api/v1/health" 2>/dev/null; then
              echo "backend answered on the published port on attempt ${attempt}"
              exit 0
            fi
            sleep 1
          done
          echo "::error::backend is healthy in-container but not reachable on :4005 — check the port mapping" >&2
          exit 1

      - name: Run the realtime smoke suite against the development image
        env:
          SMOKE_API_URL: http://localhost:4005
          SMOKE_STATE_FILE: ${{ runner.temp }}/smoke-state.json
        run: cd backend && bun run smoke

      - name: Gracefully restart the backend container
        run: |
          set -euo pipefail
          docker compose --env-file "$RUNNER_TEMP/dev.env" \
            -f docker-compose.yml restart backend

      - name: Wait for the backend to answer again after restart
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            if curl -sS --max-time 5 -o /dev/null "http://localhost:4005/api/v1/health" 2>/dev/null; then
              echo "backend answered again on attempt ${attempt}"
              exit 0
            fi
            sleep 1
          done
          echo "::error::backend did not recover on :4005 within 60s of a graceful restart" >&2
          exit 1

      - name: Re-run the realtime smoke suite after the restart
        env:
          SMOKE_API_URL: http://localhost:4005
          SMOKE_STATE_FILE: ${{ runner.temp }}/smoke-state.json
        run: cd backend && bun run smoke

      - name: Output dev compose smoke summary
        run: |
          echo "### 🐳 Dev Compose Smoke Passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`backend/Dockerfile\` (development build with hot reloading)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Container health, published port (:4005), and realtime smoke recovery verified." >> "$GITHUB_STEP_SUMMARY"

      - name: Collect service logs
        if: failure()
        run: |
          docker compose --env-file "$RUNNER_TEMP/dev.env" \
            -f docker-compose.yml logs --no-color db redis backend

      - name: Tear the stack down
        if: always()
        run: |
          docker compose --env-file "$RUNNER_TEMP/dev.env" \
            -f docker-compose.yml down -v --remove-orphans
