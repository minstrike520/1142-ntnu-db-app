name: 建立版本與 GitHub Release

# 第二階段：只在 main 的完整 CI 成功後執行 Semantic Release。
#
# 專用 Release GitHub App 的 installation token 能 bypass 版本 tag 建立規則，
# 且它推送的 commit 與 tag 會正常產生後續 workflow 事件：
#
#   CI(M) 完成 → 本 workflow 建立版本 commit R 與 tag → release-stack.yml
#
# R 也會啟動一次 CI；該 CI 完成後，本 workflow 會再次被喚起，因此 guard 會精確
# 略過 chore(release): X.Y.Z。若 main 已前進到另一個 commit，也交給較新的 CI run
# 發布，避免從已過期的 commit 計算或推送版本。

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]

permissions: {}

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: 執行 Semantic Release
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    permissions:
      contents: read
    steps:
      - name: 取出已通過 CI 的 main
        uses: actions/checkout@v7
        with:
          ref: main
          # Semantic Release 需要完整的 commit 與 tag 歷史才能判斷「上次發布後有
          # 哪些變更」與應該的版本號；shallow clone 會讓它算錯或整個略過發布。
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: 確認發布來源
        id: guard
        shell: bash
        env:
          CI_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          checked_sha="$(git rev-parse HEAD)"
          if [[ "$checked_sha" != "$CI_HEAD_SHA" ]]; then
            echo "main 已從本次 CI commit 前進，交由較新的 CI run 發布：ci=$CI_HEAD_SHA main=$checked_sha"
            echo 'should_release=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          subject="$(git show -s --format=%s HEAD)"
          if [[ "$subject" =~ ^chore\(release\):[[:space:]][0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "略過 Semantic Release 版本號 commit 的第二次 CI：$CI_HEAD_SHA"
            echo 'should_release=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo 'should_release=true' >> "$GITHUB_OUTPUT"

      - name: 建立 Release App token
        if: steps.guard.outputs.should_release == 'true'
        id: release-app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - if: steps.guard.outputs.should_release == 'true'
        uses: pnpm/action-setup@v6

      - if: steps.guard.outputs.should_release == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: 安裝依賴
        if: steps.guard.outputs.should_release == 'true'
        run: pnpm install --frozen-lockfile

      - name: 執行 Semantic Release
        if: steps.guard.outputs.should_release == 'true'
        env:
          GITHUB_TOKEN: ${{ steps.release-app.outputs.token }}
        run: npx semantic-release
