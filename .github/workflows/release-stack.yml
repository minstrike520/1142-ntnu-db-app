name: 發布完整 Near Chat Stack

on:
  # Triggered by tag push from Release Please, or manual dispatch.
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-stack-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: nearcsie/near-chat-backend
  FRONTEND_IMAGE_NAME: nearcsie/near-chat-frontend
  POSTGRES_IMAGE: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15

permissions: {}

jobs:
  publish:
    name: 驗證版本、發布完整 Stack 與建立 Release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: write
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: 取出完整版本歷史
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: 驗證版本標籤、main HEAD 與完整 CI
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "版本標籤必須完全符合 vX.Y.Z：$GITHUB_REF_NAME" >&2
            exit 1
          fi

          version="${GITHUB_REF_NAME#v}"
          root_version="$(jq -r '.version // empty' package.json)"
          backend_version="$(jq -r '.version // empty' backend/package.json)"
          frontend_version="$(jq -r '.version // empty' frontend/package.json)"
          if [[ "$root_version" != "$version" || "$backend_version" != "$version" || "$frontend_version" != "$version" ]]; then
            echo "Tag 版本必須同時等於 root、backend、frontend package.json：tag=$version root=$root_version backend=$backend_version frontend=$frontend_version" >&2
            exit 1
          fi

          tag_ref="refs/tags/${GITHUB_REF_NAME}"
          git fetch --force origin "${tag_ref}:${tag_ref}"

          # Ensure tag points to the current workflow commit.
          peeled_sha="$(git rev-parse "${tag_ref}^{}")"
          if [[ "$(git cat-file -t "$peeled_sha")" != "commit" || "$peeled_sha" != "$GITHUB_SHA" ]]; then
            echo "Tag peeled commit 必須等於 workflow commit：tag=$peeled_sha workflow=$GITHUB_SHA" >&2
            exit 1
          fi

          # Ensure tagged commit is on main branch history.
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          main_sha="$(git rev-parse refs/remotes/origin/main)"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "版本 tag 必須指向 main 歷史上的 commit：main=$main_sha tag=$GITHUB_SHA" >&2
            exit 1
          fi

          # Verify that CI passed on this exact commit.
          runs="$(gh api --method GET \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
            -f head_sha="$GITHUB_SHA" \
            -f branch=main \
            -f event=push \
            -f status=completed \
            -f per_page=100)"
          run_id="$(jq -r '
            [.workflow_runs[] | select(.conclusion == "success")]
            | first
            | .id // empty
          ' <<< "$runs")"
          if [[ -z "$run_id" ]]; then
            echo "找不到 tag commit 已完成且成功的 ci.yml push run：$GITHUB_SHA" >&2
            exit 1
          fi
          echo "CI 驗證來源 commit：$GITHUB_SHA"

          jobs="$(gh api --method GET \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs" \
            -f per_page=100)"
          # Verify the aggregate required-checks gate succeeded.
          required='required-checks'
          if ! jq -e --arg required "$required" '
            any(.jobs[]; .name == $required and .conclusion == "success")
          ' <<< "$jobs" >/dev/null; then
            echo "Main CI run 缺少成功的 ${required} gate：run_id=$run_id" >&2
            exit 1
          fi

          {
            echo "number=$version"
            echo "sha_tag=sha-${GITHUB_SHA:0:12}"
          } >> "$GITHUB_OUTPUT"

      - name: 等待 Release Please workflow 完成
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Wait for concurrent Release Please run to finish creating the GitHub release.
          runs="$(gh api --method GET \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/release-please.yml/runs" \
            -f event=workflow_run \
            -f head_sha="$GITHUB_SHA" \
            -f per_page=20)"
          release_run_id="$(jq -r '
            [.workflow_runs[] | select(.status == "in_progress")]
            | first
            | .id // empty
          ' <<< "$runs")"

          if [[ -z "$release_run_id" ]]; then
            echo "沒有仍在執行的 Release Please workflow。"
            exit 0
          fi

          for attempt in {1..60}; do
            run="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${release_run_id}")"
            status="$(jq -r .status <<< "$run")"
            conclusion="$(jq -r '.conclusion // empty' <<< "$run")"
            if [[ "$status" == "completed" ]]; then
              echo "Release Please workflow 已完成：run=$release_run_id conclusion=$conclusion"
              exit 0
            fi
            echo "等待 Release Please workflow：run=$release_run_id，第 ${attempt}/60 次"
            sleep 5
          done

          echo "等待 Release Please workflow 逾時：run=$release_run_id" >&2
          exit 1

      - name: 檢查既有 GitHub Release 與 Stack 發布狀態
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_ASSET_NAME: near-chat-stack-${{ github.ref_name }}.tar.gz
        run: |
          set -euo pipefail
          release_json="$RUNNER_TEMP/existing-stack-release.json"
          release_error="$RUNNER_TEMP/existing-stack-release.error"

          # Idempotency check: check if release bundle asset is already attached.
          if gh api "/repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" \
            > "$release_json" 2> "$release_error"; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
            if jq -e --arg name "$BUNDLE_ASSET_NAME" \
              '[.assets[].name] | index($name) != null' "$release_json" >/dev/null; then
              echo 'stack_published=true' >> "$GITHUB_OUTPUT"
              echo "Release 已附上 Stack bundle；後續只驗證，不會覆寫。"
            else
              echo 'stack_published=false' >> "$GITHUB_OUTPUT"
              echo "Release 已存在但尚未附上 Stack bundle；本次補上映像與 bundle。"
            fi
          elif grep -q 'HTTP 404' "$release_error"; then
            echo 'exists=false' >> "$GITHUB_OUTPUT"
            echo 'stack_published=false' >> "$GITHUB_OUTPUT"
            echo "Release 尚未建立；本次由本 workflow 建立（手動 tag／復原路徑）。"
          else
            cat "$release_error" >&2
            exit 1
          fi

      - name: 登入 GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 設定 Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: 檢查四個不可變映像參照
        id: registry
        shell: bash
        env:
          BACKEND_VERSION_REF: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:${{ steps.version.outputs.number }}
          BACKEND_SHA_REF: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:${{ steps.version.outputs.sha_tag }}
          FRONTEND_VERSION_REF: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ steps.version.outputs.number }}
          FRONTEND_SHA_REF: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ steps.version.outputs.sha_tag }}
          STACK_PUBLISHED: ${{ steps.release.outputs.stack_published }}
        run: |
          set -euo pipefail

          inspect_digest() {
            local ref="$1"
            local output digest
            local error_file="$RUNNER_TEMP/imagetools-inspect.error"

            if output="$(docker buildx imagetools inspect "$ref" 2> "$error_file")"; then
              digest="$(awk '$1 == "Digest:" { print $2; exit }' <<< "$output")"
              if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                echo "無法從映像參照解析 digest：$ref" >&2
                exit 1
              fi
              printf '%s' "$digest"
              return 0
            fi

            if grep -Eiq '(manifest unknown|name unknown|not found|no such manifest)' "$error_file"; then
              echo "映像參照不存在：$ref" >&2
              return 0
            fi

            cat "$error_file" >&2
            return 1
          }

          backend_version_digest="$(inspect_digest "$BACKEND_VERSION_REF")"
          backend_sha_digest="$(inspect_digest "$BACKEND_SHA_REF")"
          frontend_version_digest="$(inspect_digest "$FRONTEND_VERSION_REF")"
          frontend_sha_digest="$(inspect_digest "$FRONTEND_SHA_REF")"

          if [[ "$backend_version_digest" == "$backend_sha_digest" && -n "$backend_version_digest" ]] && \
             [[ "$frontend_version_digest" == "$frontend_sha_digest" && -n "$frontend_version_digest" ]]; then
            if [[ "$STACK_PUBLISHED" != "true" ]]; then
              echo "兩個 image 已存在但 Release 尚未附上 Stack bundle；拒絕包裝或補簽既有 artifact。" >&2
              exit 1
            fi
            echo 'build_required=false' >> "$GITHUB_OUTPUT"
            echo "backend_digest=$backend_version_digest" >> "$GITHUB_OUTPUT"
            echo "frontend_digest=$frontend_version_digest" >> "$GITHUB_OUTPUT"
          elif [[ -z "$backend_version_digest" && -z "$backend_sha_digest" && -z "$frontend_version_digest" && -z "$frontend_sha_digest" ]]; then
            if [[ "$STACK_PUBLISHED" == "true" ]]; then
              echo "Release 已附上 Stack bundle 但四個 image 參照皆遺失；拒絕以新建置取代既有 artifact。" >&2
              exit 1
            fi
            echo 'build_required=true' >> "$GITHUB_OUTPUT"
            echo 'backend_digest=' >> "$GITHUB_OUTPUT"
            echo 'frontend_digest=' >> "$GITHUB_OUTPUT"
          else
            echo "完整 Stack 發布不完整或 image digest 不一致，拒絕自動修補。" >&2
            exit 1
          fi

      - name: 首次建置並推送 backend image
        if: steps.registry.outputs.build_required == 'true'
        id: push_backend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./backend/Dockerfile.prod
          push: true
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          tags: |
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:${{ steps.version.outputs.number }}
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:${{ steps.version.outputs.sha_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.number }}

      - name: 首次建置並推送 frontend image
        if: steps.registry.outputs.build_required == 'true'
        id: push_frontend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./frontend/Dockerfile.prod
          push: true
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:4005
          tags: |
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ steps.version.outputs.number }}
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ steps.version.outputs.sha_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.number }}

      - name: 解析兩個 image 的最終 digest
        id: resolved
        shell: bash
        env:
          BUILD_REQUIRED: ${{ steps.registry.outputs.build_required }}
          EXISTING_BACKEND_DIGEST: ${{ steps.registry.outputs.backend_digest }}
          EXISTING_FRONTEND_DIGEST: ${{ steps.registry.outputs.frontend_digest }}
          BUILT_BACKEND_DIGEST: ${{ steps.push_backend.outputs.digest }}
          BUILT_FRONTEND_DIGEST: ${{ steps.push_frontend.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ "$BUILD_REQUIRED" == "true" ]]; then
            backend_digest="$BUILT_BACKEND_DIGEST"
            frontend_digest="$BUILT_FRONTEND_DIGEST"
          else
            backend_digest="$EXISTING_BACKEND_DIGEST"
            frontend_digest="$EXISTING_FRONTEND_DIGEST"
          fi

          for pair in "backend:$backend_digest" "frontend:$frontend_digest"; do
            name="${pair%%:*}"
            digest="${pair#*:}"
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "$name image digest 無效：$digest" >&2
              exit 1
            fi
            echo "${name}_digest=$digest" >> "$GITHUB_OUTPUT"
          done

      - name: 驗證既有 Release 不可變內容
        if: steps.release.outputs.stack_published == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BACKEND_DIGEST: ${{ steps.resolved.outputs.backend_digest }}
          FRONTEND_DIGEST: ${{ steps.resolved.outputs.frontend_digest }}
          BUNDLE_ASSET_NAME: near-chat-stack-${{ github.ref_name }}.tar.gz
        run: |
          set -euo pipefail
          release_state="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease)"
          if [[ "$(jq -r '.isDraft' <<< "$release_state")" != "false" || "$(jq -r '.isPrerelease' <<< "$release_state")" != "false" ]]; then
            echo "既有 Release 尚未成為正式公開版本，拒絕自動宣告成功。" >&2
            exit 1
          fi
          body="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
          if [[ "$body" != *"$GITHUB_SHA"* || "$body" != *"$BACKEND_DIGEST"* || "$body" != *"$FRONTEND_DIGEST"* || "$body" != *"$POSTGRES_IMAGE"* ]]; then
            echo "既有 Release 與預期 source commit、兩個 image digest 或 PostgreSQL digest 不一致。" >&2
            exit 1
          fi
          asset_found="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq "[.assets[].name] | index(\"$BUNDLE_ASSET_NAME\") // -1")"
          if [[ "$asset_found" == "-1" ]]; then
            echo "既有 Release 缺少完整 Stack bundle：$BUNDLE_ASSET_NAME" >&2
            exit 1
          fi

      - name: 建立 backend image provenance
        if: steps.registry.outputs.build_required == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}
          subject-digest: ${{ steps.resolved.outputs.backend_digest }}
          push-to-registry: true
          create-storage-record: false

      - name: 建立 frontend image provenance
        if: steps.registry.outputs.build_required == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}
          subject-digest: ${{ steps.resolved.outputs.frontend_digest }}
          push-to-registry: true
          create-storage-record: false

      - name: 驗證 backend image provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ steps.resolved.outputs.backend_digest }}
        run: |
          set -euo pipefail
          gh attestation verify \
            "oci://${REGISTRY}/${BACKEND_IMAGE_NAME}@${IMAGE_DIGEST}" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-stack.yml" \
            --source-digest "$GITHUB_SHA" \
            --bundle-from-oci

      - name: 驗證 frontend image provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ steps.resolved.outputs.frontend_digest }}
        run: |
          set -euo pipefail
          gh attestation verify \
            "oci://${REGISTRY}/${FRONTEND_IMAGE_NAME}@${IMAGE_DIGEST}" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-stack.yml" \
            --source-digest "$GITHUB_SHA" \
            --bundle-from-oci

      - name: 建立可部署 Stack bundle
        id: bundle
        shell: bash
        env:
          BACKEND_DIGEST: ${{ steps.resolved.outputs.backend_digest }}
          FRONTEND_DIGEST: ${{ steps.resolved.outputs.frontend_digest }}
          VERSION_NUMBER: ${{ steps.version.outputs.number }}
          IMAGE_SHA_TAG: ${{ steps.version.outputs.sha_tag }}
        run: |
          set -euo pipefail
          bundle_dir="$RUNNER_TEMP/near-chat-stack-${GITHUB_REF_NAME}"
          archive="$RUNNER_TEMP/near-chat-stack-${GITHUB_REF_NAME}.tar.gz"
          mkdir -p "$bundle_dir"
          cp docker-compose.release.yml "$bundle_dir/docker-compose.release.yml"

          cat > "$bundle_dir/near-chat.env.example" <<EOF
          NEAR_CHAT_VERSION=$VERSION_NUMBER
          BACKEND_IMAGE=${REGISTRY}/${BACKEND_IMAGE_NAME}@${BACKEND_DIGEST}
          FRONTEND_IMAGE=${REGISTRY}/${FRONTEND_IMAGE_NAME}@${FRONTEND_DIGEST}
          POSTGRES_USER=change-me
          POSTGRES_PASSWORD=change-me
          POSTGRES_DB=near_chat
          DATABASE_URL=postgresql://change-me:change-me@db:5432/near_chat
          # Optional Redis URL for cross-instance fan-out (requires Redis 7.4+ for presence TTL).
          REDIS_URL=
          PRESENCE_TTL_MS=30000
          INSTANCE_ID=
          # Set per deployment when several share one Redis: pub/sub ignores the
          # logical database, so a different REDIS_URL database does not isolate them.
          REALTIME_CLUSTER_ID=
          JWT_SECRET=change-me-to-a-long-random-secret
          JWT_EXPIRES_IN=15m
          CORS_ORIGINS=http://localhost:3005
          NEXT_PUBLIC_API_URL=http://localhost:4005
          UPLOADS_MOUNT_SOURCE=app_uploads
          # Number of reverse proxies in front of backend (0 if direct).
          TRUST_PROXY_HOPS=0
          EOF

          jq -n \
            --arg version "v${VERSION_NUMBER}" \
            --arg commit "$GITHUB_SHA" \
            --arg backend_version "${REGISTRY}/${BACKEND_IMAGE_NAME}:${VERSION_NUMBER}" \
            --arg backend_sha "${REGISTRY}/${BACKEND_IMAGE_NAME}:${IMAGE_SHA_TAG}" \
            --arg backend_digest "${REGISTRY}/${BACKEND_IMAGE_NAME}@${BACKEND_DIGEST}" \
            --arg frontend_version "${REGISTRY}/${FRONTEND_IMAGE_NAME}:${VERSION_NUMBER}" \
            --arg frontend_sha "${REGISTRY}/${FRONTEND_IMAGE_NAME}:${IMAGE_SHA_TAG}" \
            --arg frontend_digest "${REGISTRY}/${FRONTEND_IMAGE_NAME}@${FRONTEND_DIGEST}" \
            --arg postgres "$POSTGRES_IMAGE" \
            '{version:$version, sourceCommit:$commit, images:{backend:{versionTag:$backend_version,shaTag:$backend_sha,digest:$backend_digest},frontend:{versionTag:$frontend_version,shaTag:$frontend_sha,digest:$frontend_digest}}, database:{runtimeImage:$postgres, migrations:{runner:"backend image", command:"bun run migrate:up"}}, composeFile:"docker-compose.release.yml"}' \
            > "$bundle_dir/release-manifest.json"

          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -cf - -C "$RUNNER_TEMP" "$(basename "$bundle_dir")" \
            | gzip -n > "$archive"
          bundle_sha256="$(sha256sum "$archive" | awk '{print $1}')"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "asset_name=$(basename "$archive")" >> "$GITHUB_OUTPUT"
          echo "sha256=$bundle_sha256" >> "$GITHUB_OUTPUT"

      - name: 驗證既有 Stack bundle 完整性
        if: steps.release.outputs.stack_published == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_ASSET_NAME: ${{ steps.bundle.outputs.asset_name }}
          EXPECTED_BUNDLE_SHA256: ${{ steps.bundle.outputs.sha256 }}
          BACKEND_DIGEST: ${{ steps.resolved.outputs.backend_digest }}
          FRONTEND_DIGEST: ${{ steps.resolved.outputs.frontend_digest }}
          VERSION_NUMBER: ${{ steps.version.outputs.number }}
        run: |
          set -euo pipefail
          body="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
          if [[ "$body" != *"$EXPECTED_BUNDLE_SHA256"* ]]; then
            echo "既有 Release 未記錄預期的 bundle SHA-256。" >&2
            exit 1
          fi

          download_dir="$RUNNER_TEMP/existing-stack-bundle"
          extract_dir="$RUNNER_TEMP/extracted-stack-bundle"
          mkdir -p "$download_dir" "$extract_dir"
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$BUNDLE_ASSET_NAME" \
            --dir "$download_dir" \
            --clobber
          downloaded="$download_dir/$BUNDLE_ASSET_NAME"
          actual_bundle_sha256="$(sha256sum "$downloaded" | awk '{print $1}')"
          if [[ "$actual_bundle_sha256" != "$EXPECTED_BUNDLE_SHA256" ]]; then
            echo "既有 Stack bundle SHA-256 不一致。" >&2
            exit 1
          fi

          tar -xzf "$downloaded" -C "$extract_dir"
          bundle_root="$extract_dir/near-chat-stack-${GITHUB_REF_NAME}"
          test -f "$bundle_root/docker-compose.release.yml"
          test -f "$bundle_root/near-chat.env.example"
          test -f "$bundle_root/release-manifest.json"
          if find "$bundle_root" -type f \( -name '.env' -o -name '.env.*' \) -print -quit | grep -q .; then
            echo "Release bundle 包含秘密環境檔。" >&2
            exit 1
          fi

          jq -e \
            --arg version "v${VERSION_NUMBER}" \
            --arg commit "$GITHUB_SHA" \
            --arg backend_digest "${REGISTRY}/${BACKEND_IMAGE_NAME}@${BACKEND_DIGEST}" \
            --arg frontend_digest "${REGISTRY}/${FRONTEND_IMAGE_NAME}@${FRONTEND_DIGEST}" \
            --arg postgres "$POSTGRES_IMAGE" \
            '.version == $version
             and .sourceCommit == $commit
             and .images.backend.digest == $backend_digest
             and .images.frontend.digest == $frontend_digest
             and .database.runtimeImage == $postgres
             and .database.migrations.command == "bun run migrate:up"' \
            "$bundle_root/release-manifest.json" >/dev/null
          grep -F "image: $POSTGRES_IMAGE" "$bundle_root/docker-compose.release.yml" >/dev/null

      - name: 產生 Stack 發布說明區段
        if: steps.release.outputs.stack_published == 'false'
        id: stack_notes
        shell: bash
        env:
          VERSION_NUMBER: ${{ steps.version.outputs.number }}
          IMAGE_SHA_TAG: ${{ steps.version.outputs.sha_tag }}
          BACKEND_DIGEST: ${{ steps.resolved.outputs.backend_digest }}
          FRONTEND_DIGEST: ${{ steps.resolved.outputs.frontend_digest }}
          BUNDLE_SHA256: ${{ steps.bundle.outputs.sha256 }}
          BUNDLE_ASSET_NAME: ${{ steps.bundle.outputs.asset_name }}
        run: |
          set -euo pipefail
          notes_file="$RUNNER_TEMP/stack-release-notes.md"
          backend_image="${REGISTRY}/${BACKEND_IMAGE_NAME}"
          frontend_image="${REGISTRY}/${FRONTEND_IMAGE_NAME}"

          {
            previous_tag="$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)"

            echo '## Complete Stack'
            echo
            printf -- '- Version: `%s`\n' "$GITHUB_REF_NAME"
            printf -- '- Commit: `%s`\n' "$GITHUB_SHA"
            printf -- '- Backend image: `%s:%s`\n' "$backend_image" "$VERSION_NUMBER"
            printf -- '- Backend commit image: `%s:%s`\n' "$backend_image" "$IMAGE_SHA_TAG"
            printf -- '- Backend digest: `%s@%s`\n' "$backend_image" "$BACKEND_DIGEST"
            printf -- '- Frontend image: `%s:%s`\n' "$frontend_image" "$VERSION_NUMBER"
            printf -- '- Frontend commit image: `%s:%s`\n' "$frontend_image" "$IMAGE_SHA_TAG"
            printf -- '- Frontend digest: `%s@%s`\n' "$frontend_image" "$FRONTEND_DIGEST"
            printf -- '- PostgreSQL runtime: `%s`\n' "$POSTGRES_IMAGE"
            printf -- '- Deployment bundle: `%s`\n' "$BUNDLE_ASSET_NAME"
            printf -- '- Bundle SHA-256: `%s`\n' "$BUNDLE_SHA256"
            if [[ -n "$previous_tag" ]]; then
              printf -- '- Full diff: https://github.com/%s/compare/%s...%s\n' \
                "$GITHUB_REPOSITORY" "$previous_tag" "$GITHUB_REF_NAME"
            fi
          } > "$notes_file"

          echo "file=$notes_file" >> "$GITHUB_OUTPUT"

      # Append stack notes and upload bundle asset to the existing GitHub release.
      - name: 於既有 Release 補上 Stack artifact
        if: steps.release.outputs.exists == 'true' && steps.release.outputs.stack_published == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STACK_NOTES_FILE: ${{ steps.stack_notes.outputs.file }}
          BUNDLE_ARCHIVE: ${{ steps.bundle.outputs.archive }}
        run: |
          set -euo pipefail
          merged_notes="$RUNNER_TEMP/merged-release-notes.md"
          gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json body --jq .body > "$merged_notes"
          {
            echo
            echo '---'
            echo
            cat "$STACK_NOTES_FILE"
          } >> "$merged_notes"

          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --notes-file "$merged_notes"
          gh release upload "$GITHUB_REF_NAME" "$BUNDLE_ARCHIVE" \
            --repo "$GITHUB_REPOSITORY"

      - name: 建立 GitHub Release
        if: steps.release.outputs.exists == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STACK_NOTES_FILE: ${{ steps.stack_notes.outputs.file }}
          BUNDLE_ARCHIVE: ${{ steps.bundle.outputs.archive }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Near Chat $GITHUB_REF_NAME" \
            --notes-file "$STACK_NOTES_FILE" \
            --latest=false \
            "$BUNDLE_ARCHIVE"

      - name: 輸出發布摘要至 Step Summary
        if: always()
        run: |
          if [ -f "${{ steps.stack_notes.outputs.file }}" ]; then
            cat "${{ steps.stack_notes.outputs.file }}" >> "$GITHUB_STEP_SUMMARY"
          fi
