name: CI

# Workflow file and display name are referenced by release workflows; keep unchanged.

on:
  push:
    branches: [main]
  pull_request:
    # No branch/path filters so required-checks status check always reports on PRs.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Cancel in-flight PR runs, but preserve main branch runs for release-please.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend-required: ${{ steps.plan.outputs.frontend-required }}
      backend-required: ${{ steps.plan.outputs.backend-required }}
      database-required: ${{ steps.plan.outputs.database-required }}
      browser-required: ${{ steps.plan.outputs.browser-required }}
      security-required: ${{ steps.plan.outputs.security-required }}
      run-build: ${{ steps.plan.outputs.run-build }}
    steps:
      - uses: actions/checkout@v7
      # Ensure only the root pnpm-lock.yaml exists in the workspace.
      - name: Reject nested lockfiles
        run: |
          nested="$(git ls-files '*/pnpm-lock.yaml' '*/bun.lock')"
          if [ -n "$nested" ]; then
            echo "::error::Nested lockfile(s) committed. Only the root pnpm-lock.yaml is allowed:"
            echo "$nested"
            exit 1
          fi
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # Match positive patterns while respecting excluded files (e.g. CLAUDE.md).
          predicate-quantifier: some-with-excludes
          filters: |
            frontend:
              - 'frontend/**'
              - '!frontend/**/CLAUDE.md'
              - 'shared/**'
              - 'tsconfig.base.json'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'scripts/**'
              - '.dockerignore'
              - 'docker-compose*.yml'
              - '.github/workflows/**'
              - '.github/actions/**'
            backend:
              - 'backend/**'
              - '!backend/**/CLAUDE.md'
              - 'shared/**'
              - 'tsconfig.base.json'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.dockerignore'
              - 'docker-compose*.yml'
              - '.github/workflows/**'
              - '.github/actions/**'
            security:
              - '**/package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.cve-lite/**'
              - '.github/workflows/**'
              - '.github/actions/**'

      # Single source of truth for "does this lane have to run". Both the lane
      # `if:` conditions and the required-checks gate read these outputs, so the
      # execution decision cannot drift between the two. Adding a condition here
      # automatically keeps the gate honest.
      - name: Plan which lanes must run
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE_REF: ${{ github.base_ref }}
          FRONTEND_CHANGED: ${{ steps.filter.outputs.frontend }}
          BACKEND_CHANGED: ${{ steps.filter.outputs.backend }}
          SECURITY_CHANGED: ${{ steps.filter.outputs.security }}
        run: |
          set -euo pipefail

          frontend_required=false
          backend_required=false
          database_required=false
          browser_required=false
          security_required=false
          run_build=false

          # Browser lane runs if frontend or backend changes (fullstack tests exercise both).
          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$FRONTEND_CHANGED" == "true" ]]; then
            frontend_required=true
          fi

          if [[ "$EVENT_NAME" == "workflow_dispatch" || \
                "$FRONTEND_CHANGED" == "true" || \
                "$BACKEND_CHANGED" == "true" ]]; then
            browser_required=true
          fi

          # Database lane verifies backend integration against PostgreSQL.
          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$BACKEND_CHANGED" == "true" ]]; then
            backend_required=true
            database_required=true
          fi

          # Run build and security audit on main branch commits and PRs targeting main.
          if [[ "$REF" == "refs/heads/main" || "$BASE_REF" == "main" ]]; then
            run_build=true

            if [[ "$EVENT_NAME" == "workflow_dispatch" || \
                  "$FRONTEND_CHANGED" == "true" || \
                  "$BACKEND_CHANGED" == "true" || \
                  "$SECURITY_CHANGED" == "true" ]]; then
              security_required=true
            fi
          fi

          {
            echo "frontend-required=$frontend_required"
            echo "backend-required=$backend_required"
            echo "database-required=$database_required"
            echo "browser-required=$browser_required"
            echo "security-required=$security_required"
            echo "run-build=$run_build"
          } >> "$GITHUB_OUTPUT"

  frontend:
    needs: detect
    if: needs.detect.outputs.frontend-required == 'true'
    uses: ./.github/workflows/ci-frontend.yml
    with:
      run-build: ${{ fromJSON(needs.detect.outputs.run-build) }}

  backend:
    needs: detect
    if: needs.detect.outputs.backend-required == 'true'
    uses: ./.github/workflows/ci-backend.yml
    with:
      run-build: ${{ fromJSON(needs.detect.outputs.run-build) }}

  database:
    needs: detect
    if: needs.detect.outputs.database-required == 'true'
    uses: ./.github/workflows/ci-database.yml

  browser:
    needs: detect
    if: needs.detect.outputs.browser-required == 'true'
    uses: ./.github/workflows/ci-browser.yml

  security:
    needs: detect
    if: needs.detect.outputs.security-required == 'true'
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/ci-security.yml

  # Canonical status check required by branch protection and release workflows.
  required-checks:
    name: required-checks
    if: always()
    needs: [detect, frontend, backend, database, browser, security]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify every lane reached an acceptable state
        env:
          DETECT_RESULT: ${{ needs.detect.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          DATABASE_RESULT: ${{ needs.database.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          FRONTEND_REQUIRED: ${{ needs.detect.outputs.frontend-required }}
          BACKEND_REQUIRED: ${{ needs.detect.outputs.backend-required }}
          DATABASE_REQUIRED: ${{ needs.detect.outputs.database-required }}
          BROWSER_REQUIRED: ${{ needs.detect.outputs.browser-required }}
          SECURITY_REQUIRED: ${{ needs.detect.outputs.security-required }}
        run: |
          set -uo pipefail

          failed=false
          fail() {
            echo "::error::$1"
            failed=true
          }

          # Enforces that required lanes succeeded, and non-required lanes either succeeded or were skipped.
          check_lane() { # name, result, required
            if [[ "$3" != "true" && "$3" != "false" ]]; then
              fail "$1 required-flag is '$3'; expected true or false (missing or misspelled detect output)"
              return
            fi

            if [[ "$3" == "true" ]]; then
              [[ "$2" == "success" ]] || fail "$1 was required but finished as $2"
            else
              [[ "$2" == "success" || "$2" == "skipped" ]] || fail "$1 finished as $2"
            fi
          }

          [[ "$DETECT_RESULT" == "success" ]] || fail "detect finished as $DETECT_RESULT"

          check_lane frontend "$FRONTEND_RESULT" "$FRONTEND_REQUIRED"
          check_lane backend "$BACKEND_RESULT" "$BACKEND_REQUIRED"
          check_lane database "$DATABASE_RESULT" "$DATABASE_REQUIRED"
          check_lane browser "$BROWSER_RESULT" "$BROWSER_REQUIRED"
          check_lane security "$SECURITY_RESULT" "$SECURITY_REQUIRED"

          status_badge() {
            local res="$1"
            case "$res" in
              success) echo "✅ \`success\`" ;;
              skipped) echo "⚪ \`skipped\`" ;;
              failure) echo "❌ \`failure\`" ;;
              cancelled) echo "⚠️ \`cancelled\`" ;;
              *) echo "\`$res\`" ;;
            esac
          }

          overall_status="✅ **All required checks passed**"
          if [[ "$failed" != "false" ]]; then
            overall_status="❌ **Required checks failed**"
          fi
          {
            echo "## CI Status Summary"
            echo
            echo "$overall_status"
            echo
            echo "| Lane | Required | Result |"
            echo "| :--- | :---: | :--- |"
            echo "| **detect** | always | $(status_badge "$DETECT_RESULT") |"
            echo "| **frontend** | \`$FRONTEND_REQUIRED\` | $(status_badge "$FRONTEND_RESULT") |"
            echo "| **backend** | \`$BACKEND_REQUIRED\` | $(status_badge "$BACKEND_RESULT") |"
            echo "| **database** | \`$DATABASE_REQUIRED\` | $(status_badge "$DATABASE_RESULT") |"
            echo "| **browser** | \`$BROWSER_REQUIRED\` | $(status_badge "$BROWSER_RESULT") |"
            echo "| **security** | \`$SECURITY_REQUIRED\` | $(status_badge "$SECURITY_RESULT") |"
          } >> "$GITHUB_STEP_SUMMARY"

          [[ "$failed" == "false" ]]
