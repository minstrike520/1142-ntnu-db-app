name: CI

on:
  push:
    branches: [main, dev, 'legacy/backend-express-node']
  pull_request:
    branches: [main, dev, 'legacy/backend-express-node']
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - 'shared/**'
              - 'tsconfig.base.json'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - '.env.example'
              - '.dockerignore'
              - 'docker-compose*.yml'
              - '.github/workflows/**'
            backend:
              - 'backend/**'
              - 'shared/**'
              - 'tsconfig.base.json'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - '.env.example'
              - '.dockerignore'
              - 'docker-compose*.yml'
              - '.github/workflows/**'

  frontend-lint:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/legacy/backend-express-node' || github.base_ref == 'legacy/backend-express-node'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --prefix frontend install --frozen-lockfile
      - run: pnpm --prefix frontend run lint

  frontend-typecheck:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/legacy/backend-express-node' || github.base_ref == 'legacy/backend-express-node'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --prefix frontend install --frozen-lockfile
      - run: pnpm --prefix frontend exec tsc --noEmit

  frontend-build:
    needs: changes
    if: ((needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.base_ref == 'main')) || github.ref == 'refs/heads/legacy/backend-express-node' || github.base_ref == 'legacy/backend-express-node'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --prefix frontend install --frozen-lockfile
      - run: pnpm --prefix frontend run build

  backend-build:
    needs: changes
    if: ((needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.base_ref == 'main')) || github.ref == 'refs/heads/legacy/backend-express-node' || github.base_ref == 'legacy/backend-express-node'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm --prefix backend install --frozen-lockfile
      - run: pnpm --prefix backend run build

  unit-tests:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/legacy/backend-express-node' || github.base_ref == 'legacy/backend-express-node'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm --prefix backend install --frozen-lockfile
      - run: pnpm --prefix backend run test:unit

  integration-tests:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/legacy/backend-express-node' || github.base_ref == 'legacy/backend-express-node'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ntnu_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5433/ntnu_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm --prefix backend install --frozen-lockfile
      - run: DATABASE_URL=$DATABASE_URL_TEST pnpm --prefix backend run migrate:up
      - run: pnpm --prefix backend run test:integration

  e2e-tests:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/legacy/backend-express-node' || github.base_ref == 'legacy/backend-express-node'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ntnu_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5433/ntnu_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm --prefix backend install --frozen-lockfile
      - run: DATABASE_URL=$DATABASE_URL_TEST pnpm --prefix backend run migrate:up
      - run: pnpm --prefix backend run test:e2e

  security-scan:
    needs: changes
    if: ((needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.base_ref == 'main')) || github.ref == 'refs/heads/legacy/backend-express-node' || github.base_ref == 'legacy/backend-express-node'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Scan backend dependencies for vulnerabilities
        uses: OWASP/cve-lite-cli@v1
        with:
          path: "./backend"
          all: "true"
          verbose: "true"
          fail-on: high
          sarif: "true"
      - name: Rename backend SARIF file
        if: always()
        run: |
          if ls cve-lite-scan-*.sarif 1> /dev/null 2>&1; then
            mv cve-lite-scan-*.sarif backend.sarif
          fi
      - name: Upload backend scan to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: backend.sarif
          category: backend
      - name: Scan frontend dependencies for vulnerabilities
        uses: OWASP/cve-lite-cli@v1
        with:
          path: "./frontend"
          all: "true"
          verbose: "true"
          fail-on: high
          sarif: "true"
      - name: Rename frontend SARIF file
        if: always()
        run: |
          if ls cve-lite-scan-*.sarif 1> /dev/null 2>&1; then
            mv cve-lite-scan-*.sarif frontend.sarif
          fi
      - name: Upload frontend scan to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: frontend.sarif
          category: frontend

  legacy-required:
    name: Legacy required checks
    needs:
      - changes
      - frontend-lint
      - frontend-typecheck
      - frontend-build
      - backend-build
      - unit-tests
      - integration-tests
      - e2e-tests
      - security-scan
    if: always()
    runs-on: ubuntu-latest
    env:
      NEEDS_JSON: ${{ toJSON(needs) }}
      LEGACY_RUN: ${{ github.ref == 'refs/heads/legacy/backend-express-node' || github.base_ref == 'legacy/backend-express-node' }}
    steps:
      - name: 驗證所有必要工作
        shell: bash
        run: |
          set -euo pipefail
          failed="$(jq -r '
            to_entries[]
            | select(.value.result != "success" and .value.result != "skipped")
            | "\(.key)=\(.value.result)"
          ' <<< "$NEEDS_JSON")"

          if [[ -n "$failed" ]]; then
            echo "下列必要工作未成功：" >&2
            echo "$failed" >&2
            exit 1
          fi

          if [[ "$LEGACY_RUN" == "true" ]]; then
            incomplete="$(jq -r '
              to_entries[]
              | .key as $job
              | select([
                  "frontend-lint",
                  "frontend-typecheck",
                  "frontend-build",
                  "backend-build",
                  "unit-tests",
                  "integration-tests",
                  "e2e-tests",
                  "security-scan"
                ] | index($job))
              | select(.value.result != "success")
              | "\(.key)=\(.value.result)"
            ' <<< "$NEEDS_JSON")"

            if [[ -n "$incomplete" ]]; then
              echo "Legacy push／PR 的完整檢查不得 skipped 或未成功：" >&2
              echo "$incomplete" >&2
              exit 1
            fi
          fi

          echo "所有必要工作皆為 success 或 skipped。"
