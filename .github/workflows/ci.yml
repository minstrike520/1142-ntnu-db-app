name: CI

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'README.zh-TW.md'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE'
      - 'AGENTS.md'
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'README.zh-TW.md'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE'
      - 'AGENTS.md'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v7
      # This repo is a single-root-lockfile pnpm workspace. Running
      # `pnpm install` from inside frontend/ or backend/ silently creates a
      # nested lockfile, which is how the root lockfile drifted out of sync
      # with frontend/package.json in the first place (issue #420).
      - name: Reject nested lockfiles
        run: |
          nested="$(git ls-files '*/pnpm-lock.yaml' '*/bun.lock')"
          if [ -n "$nested" ]; then
            echo "::error::Nested lockfile(s) committed. Only the root pnpm-lock.yaml is allowed:"
            echo "$nested"
            exit 1
          fi
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # The root workspace files are load-bearing for BOTH packages now that
          # every job installs from the single root lockfile. Without them here,
          # a PR touching only pnpm-lock.yaml, the `overrides` block, or the root
          # package.json would output false for both filters and skip lint,
          # typecheck, tests, builds and security-scan — and `release` treats
          # skipped as success, so a dependency or CVE-override change could ship
          # completely unverified.
          filters: |
            frontend:
              - 'frontend/**'
              - 'shared/**'
              - 'tsconfig.base.json'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci.yml'
            backend:
              - 'backend/**'
              - 'shared/**'
              - 'tsconfig.base.json'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci.yml'

  frontend-lint:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile --filter near-chat-frontend...
      - run: pnpm --filter near-chat-frontend lint

  frontend-typecheck:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile --filter near-chat-frontend...
      - run: pnpm --filter near-chat-frontend exec tsc --noEmit

  frontend-test:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile --filter near-chat-frontend...
      - run: pnpm --filter near-chat-frontend test

  frontend-build:
    needs: changes
    if: (needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.base_ref == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile --filter near-chat-frontend...
      - run: pnpm --filter near-chat-frontend build

  backend-build:
    needs: changes
    if: (needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.base_ref == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: pnpm install --frozen-lockfile --filter near-chat-backend...
      - run: pnpm --filter near-chat-backend build

  unit-tests:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: pnpm install --frozen-lockfile --filter near-chat-backend...
      - run: pnpm --filter near-chat-backend test:unit

  integration-tests:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ntnu_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5433/ntnu_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: pnpm install --frozen-lockfile --filter near-chat-backend...
      - run: DATABASE_URL=$DATABASE_URL_TEST pnpm --filter near-chat-backend migrate:up
      - run: pnpm --filter near-chat-backend test:integration

  e2e-tests:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ntnu_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5433/ntnu_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: pnpm install --frozen-lockfile --filter near-chat-backend...
      - run: DATABASE_URL=$DATABASE_URL_TEST pnpm --filter near-chat-backend migrate:up
      - run: pnpm --filter near-chat-backend test:e2e

  security-scan:
    needs: changes
    if: (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.base_ref == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      # Scans the whole workspace from the repo root. `./backend` and
      # `./frontend` no longer contain a lockfile — there is exactly one root
      # pnpm-lock.yaml covering every importer — so the previous per-package
      # scans would have found nothing to read and could have passed silently,
      # losing CVE coverage without ever turning the build red.
      - name: Scan workspace dependencies for vulnerabilities
        uses: OWASP/cve-lite-cli@v1
        with:
          path: "."
          all: "true"
          verbose: "true"
          fail-on: high
          sarif: "true"
      - name: Rename workspace SARIF file
        if: always()
        run: |
          if ls cve-lite-scan-*.sarif 1> /dev/null 2>&1; then
            mv cve-lite-scan-*.sarif workspace.sarif
          fi
      - name: Upload workspace scan to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: workspace.sarif
          category: workspace

  release:
    needs:
      - frontend-lint
      - frontend-typecheck
      - frontend-build
      - backend-build
      - unit-tests
      - integration-tests
      - e2e-tests
      - security-scan
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      (needs.frontend-lint.result == 'success' || needs.frontend-lint.result == 'skipped') &&
      (needs.frontend-typecheck.result == 'success' || needs.frontend-typecheck.result == 'skipped') &&
      (needs.frontend-build.result == 'success' || needs.frontend-build.result == 'skipped') &&
      (needs.backend-build.result == 'success' || needs.backend-build.result == 'skipped') &&
      (needs.unit-tests.result == 'success' || needs.unit-tests.result == 'skipped') &&
      (needs.integration-tests.result == 'success' || needs.integration-tests.result == 'skipped') &&
      (needs.e2e-tests.result == 'success' || needs.e2e-tests.result == 'skipped') &&
      (needs.security-scan.result == 'success' || needs.security-scan.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
