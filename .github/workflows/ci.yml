name: CI

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'README.zh-TW.md'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE'
      - 'AGENTS.md'
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'README.zh-TW.md'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE'
      - 'AGENTS.md'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

# A newer push to the same PR makes the in-flight run obsolete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            # `workspace` covers everything that changes resolved dependencies
            # or shared config, so a lockfile bump can never skip the suites.
            workspace: &workspace
              - 'bun.lock'
              - 'package.json'
              - 'tsconfig.base.json'
              - 'shared/**'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            frontend:
              - *workspace
              - 'frontend/**'
            backend:
              - *workspace
              - 'backend/**'

  frontend-checks:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      - name: Lint
        run: bun run --filter './frontend' lint
      - name: Typecheck
        run: bun run --filter './frontend' typecheck
      - name: Unit tests
        run: bun run --filter './frontend' test

  frontend-build:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      - name: Build
        run: bun run --filter './frontend' build

  backend-checks:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      # `lint` is eslint + tsc --noEmit, which is the same typecheck the
      # backend `build` script performs.
      - name: Lint and typecheck
        run: bun run --filter './backend' lint
      - name: Unit tests
        run: bun run --filter './backend' test:unit

  backend-db-tests:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Integration and E2E used to each spin up their own Postgres. They share
    # one here: migrations run once and both suites reuse the same database.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ntnu_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5433/ntnu_test
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      - name: Run migrations
        run: DATABASE_URL=$DATABASE_URL_TEST bun run --filter './backend' migrate:up
      - name: Integration tests
        run: bun run --filter './backend' test:integration
      - name: E2E tests
        run: bun run --filter './backend' test:e2e

  security-scan:
    needs: changes
    if: (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.base_ref == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - name: Scan backend dependencies for vulnerabilities
        uses: OWASP/cve-lite-cli@v1
        with:
          path: "./backend"
          all: "true"
          verbose: "true"
          fail-on: high
          sarif: "true"
      - name: Rename backend SARIF file
        if: always()
        run: |
          if ls cve-lite-scan-*.sarif 1> /dev/null 2>&1; then
            mv cve-lite-scan-*.sarif backend.sarif
          fi
      - name: Upload backend scan to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: backend.sarif
          category: backend
      - name: Scan frontend dependencies for vulnerabilities
        uses: OWASP/cve-lite-cli@v1
        with:
          path: "./frontend"
          all: "true"
          verbose: "true"
          fail-on: high
          sarif: "true"
      - name: Rename frontend SARIF file
        if: always()
        run: |
          if ls cve-lite-scan-*.sarif 1> /dev/null 2>&1; then
            mv cve-lite-scan-*.sarif frontend.sarif
          fi
      - name: Upload frontend scan to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: frontend.sarif
          category: frontend

  release:
    needs:
      - frontend-checks
      - frontend-build
      - backend-checks
      - backend-db-tests
      - security-scan
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      (needs.frontend-checks.result == 'success' || needs.frontend-checks.result == 'skipped') &&
      (needs.frontend-build.result == 'success' || needs.frontend-build.result == 'skipped') &&
      (needs.backend-checks.result == 'success' || needs.backend-checks.result == 'skipped') &&
      (needs.backend-db-tests.result == 'success' || needs.backend-db-tests.result == 'skipped') &&
      (needs.security-scan.result == 'success' || needs.security-scan.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      # semantic-release and its plugins are Node tools: Bun installs them,
      # Node runs them.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Run Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node node_modules/semantic-release/bin/semantic-release.js
