name: CI

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'README.zh-TW.md'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE'
      - 'AGENTS.md'
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'README.zh-TW.md'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE'
      - 'AGENTS.md'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - 'shared/**'
              - 'tsconfig.base.json'
            backend:
              - 'backend/**'
              - 'shared/**'
              - 'tsconfig.base.json'

  frontend-lint:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --prefix frontend install --frozen-lockfile
      - run: pnpm --prefix frontend run lint

  frontend-typecheck:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --prefix frontend install --frozen-lockfile
      - run: pnpm --prefix frontend exec tsc --noEmit

  frontend-build:
    needs: changes
    if: (needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.base_ref == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --prefix frontend install --frozen-lockfile
      - run: pnpm --prefix frontend run build

  backend-build:
    needs: changes
    if: (needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.base_ref == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm --prefix backend install --frozen-lockfile
      - run: pnpm --prefix backend run build

  unit-tests:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm --prefix backend install --frozen-lockfile
      - run: pnpm --prefix backend run test:unit

  integration-tests:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ntnu_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5433/ntnu_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm --prefix backend install --frozen-lockfile
      - run: DATABASE_URL=$DATABASE_URL_TEST pnpm --prefix backend run migrate:up
      - run: pnpm --prefix backend run test:integration

  e2e-tests:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ntnu_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5433/ntnu_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm --prefix backend install --frozen-lockfile
      - run: DATABASE_URL=$DATABASE_URL_TEST pnpm --prefix backend run migrate:up
      - run: pnpm --prefix backend run test:e2e

  security-scan:
    needs: changes
    if: (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.base_ref == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - name: Scan backend dependencies for vulnerabilities
        uses: OWASP/cve-lite-cli@v1
        with:
          path: "./backend"
          all: "true"
          verbose: "true"
          fail-on: high
          sarif: "true"
      - name: Rename backend SARIF file
        if: always()
        run: |
          if ls cve-lite-scan-*.sarif 1> /dev/null 2>&1; then
            mv cve-lite-scan-*.sarif backend.sarif
          fi
      - name: Upload backend scan to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: backend.sarif
          category: backend
      - name: Scan frontend dependencies for vulnerabilities
        uses: OWASP/cve-lite-cli@v1
        with:
          path: "./frontend"
          all: "true"
          verbose: "true"
          fail-on: high
          sarif: "true"
      - name: Rename frontend SARIF file
        if: always()
        run: |
          if ls cve-lite-scan-*.sarif 1> /dev/null 2>&1; then
            mv cve-lite-scan-*.sarif frontend.sarif
          fi
      - name: Upload frontend scan to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: frontend.sarif
          category: frontend

  release:
    needs:
      - frontend-lint
      - frontend-typecheck
      - frontend-build
      - backend-build
      - unit-tests
      - integration-tests
      - e2e-tests
      - security-scan
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      (needs.frontend-lint.result == 'success' || needs.frontend-lint.result == 'skipped') &&
      (needs.frontend-typecheck.result == 'success' || needs.frontend-typecheck.result == 'skipped') &&
      (needs.frontend-build.result == 'success' || needs.frontend-build.result == 'skipped') &&
      (needs.backend-build.result == 'success' || needs.backend-build.result == 'skipped') &&
      (needs.unit-tests.result == 'success' || needs.unit-tests.result == 'skipped') &&
      (needs.integration-tests.result == 'success' || needs.integration-tests.result == 'skipped') &&
      (needs.e2e-tests.result == 'success' || needs.e2e-tests.result == 'skipped') &&
      (needs.security-scan.result == 'success' || needs.security-scan.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

