name: CI Frontend

on:
  workflow_call:
    outputs:
      coverage_summary:
        description: Machine-readable unit test coverage summary
        value: ${{ jobs.coverage.outputs.coverage_summary }}
    inputs:
      run-build:
        description: Run the Next.js production build job
        # No default on purpose: a caller that forgets to pass this should fail
        # loudly rather than silently degrade into never building.
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  node-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
        with:
          package: near-chat
      - run: pnpm test:node-engine
      - run: node --test scripts/coverage-summary.test.mjs
      - run: pnpm check:node-engine

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
        with:
          package: near-chat-frontend
      - run: pnpm --filter near-chat-frontend lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
        with:
          package: near-chat-frontend
      - run: pnpm --filter near-chat-frontend typecheck

  test:
    runs-on: ubuntu-latest
    # The only job in CI given a Node version matrix, and deliberately so. All
    # legs install a byte-identical dependency tree — pnpm resolves from the
    # lockfile, and optional-dependency filtering keys on os/cpu/libc, never on
    # the Node version — so the matrix varies exactly one thing: the binary that
    # executes the task. That only buys signal where the Node version is what
    # the floor is about, and here it is: jsdom is the sole package in the graph
    # that sets the 22.22.2 floor, and this job is its only consumer
    # (frontend/vitest.config.ts runs `environment: "jsdom"`). lint, typecheck
    # and build would each cost another runner slot on every workflow-touching
    # PR to re-prove floors already covered by these legs (eslint 22.13.0, next
    # 20.9.0).
    strategy:
      # Off, not stylistic: with fail-fast on, the failing leg cancels the other
      # and destroys the signal this matrix exists to produce — which version
      # broke it. That would make the matrix strictly worse than no matrix.
      fail-fast: false
      matrix:
        # '22' is what every other job resolves to via the setup-workspace
        # default (the latest 22.x, 22.23.2 today), and is listed first because
        # it is the leg that represents the rest of CI. '22.22.2' is the literal
        # floor declared in the root package.json `engines.node`, set by
        # jsdom@30's `^22.22.2 || ^24.15.0 || >=26.0.0`. An exact pin is correct
        # for a matrix leg and wrong for a default: it proves the floor itself
        # is runnable, at the cost of a ~10-20s Node download (it is outside the
        # runner toolcache) and of receiving no later 22.x security fixes. Do
        # not "fix" it into a floating tag — that would delete the coverage.
        # Keep this literal at the minimum version derived by the node-engine
        # guard. The other legs intentionally float to the newest releases of
        # the supported Node 22 and Node 24 lines.
        # Coverage is generated once by the separate canonical Node 22 job below,
        # not by every compatibility leg.
        node-version: ['22', '22.22.2', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
        with:
          package: near-chat-frontend
          node-version: ${{ matrix.node-version }}
      - run: pnpm --filter near-chat-frontend test

  coverage:
    runs-on: ubuntu-latest
    outputs:
      coverage_summary: ${{ steps.coverage.outputs.coverage_summary }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
        with:
          package: near-chat-frontend
          # Node 22 is the canonical runtime for the non-matrix CI jobs and
          # therefore the single source of frontend coverage.
          node-version: '22'
      - name: Run unit tests with coverage
        id: unit-tests
        run: pnpm --filter near-chat-frontend test --coverage
      - name: Collect coverage summary
        id: coverage
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.unit-tests.outcome }}
        run: |
          set -uo pipefail

          summary="$(node scripts/coverage-summary.mjs vitest frontend/coverage/coverage-summary.json || true)"
          if [[ -z "$summary" ]]; then
            summary='{"status":"error","error":"coverage parser produced no output"}'
          fi
          echo "coverage_summary=$summary" >> "$GITHUB_OUTPUT"

          if ! jq -e '.status == "success"' <<<"$summary" >/dev/null; then
            if [[ "$TEST_OUTCOME" == "success" ]]; then
              echo "::error::unit tests passed but coverage collection failed"
              exit 1
            fi
          fi

  build:
    if: inputs.run-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
        with:
          package: near-chat-frontend
      - run: pnpm --filter near-chat-frontend build

  docker-build:
    if: inputs.run-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the development frontend image
        run: docker build -f frontend/Dockerfile -t near-chat-frontend-dev:ci .
      - name: Build the production frontend image
        run: docker build -f frontend/Dockerfile.prod --build-arg NEXT_PUBLIC_API_URL=http://localhost:4005 -t near-chat-frontend:ci .
