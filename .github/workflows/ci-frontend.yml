name: CI Frontend

on:
  workflow_call:
    inputs:
      run-build:
        description: Run the Next.js production build job
        # No default on purpose: a caller that forgets to pass this should fail
        # loudly rather than silently degrade into never building.
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  node-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
        with:
          package: near-chat
      - run: pnpm test:node-engine
      - run: pnpm check:node-engine

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
        with:
          package: near-chat-frontend
      - run: pnpm --filter near-chat-frontend lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
        with:
          package: near-chat-frontend
      - run: pnpm --filter near-chat-frontend typecheck

  # Test across Node versions to verify supported engines (22, pinned floor 22.22.2, and 24).
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '22.22.2', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
        with:
          package: near-chat-frontend
          node-version: ${{ matrix.node-version }}
      - run: pnpm --filter near-chat-frontend test

  build:
    if: inputs.run-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
        with:
          package: near-chat-frontend
      - run: pnpm --filter near-chat-frontend build

  docker-build:
    if: inputs.run-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the development frontend image
        run: docker build -f frontend/Dockerfile -t near-chat-frontend-dev:ci .
      - name: Build the production frontend image
        run: docker build -f frontend/Dockerfile.prod --build-arg NEXT_PUBLIC_API_URL=http://localhost:4005 -t near-chat-frontend:ci .
