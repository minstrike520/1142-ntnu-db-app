version: 2
updates:
  # 1. 整個 workspace 的套件（單一 root bun.lock）
  #
  # 收斂成一份 lockfile 後，/frontend 與 /backend 底下已經沒有各自的 lockfile，
  # 原本分開的三個 npm 設定會找不到目標。改用 directories 一次涵蓋所有
  # workspace 成員，Dependabot 會回頭更新 root 的 bun.lock。
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/frontend"
      - "/backend"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"

  # 2. GitHub Actions 工作流 (.github/workflows)
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "ci/cd"
      - "dependencies"

  # 3. 後端 Docker Base Image (/backend)
  - package-ecosystem: "docker"
    directory: "/backend"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "docker"
      - "backend"

  # 4. 前端 Docker Base Image (/frontend)
  - package-ecosystem: "docker"
    directory: "/frontend"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "docker"
      - "frontend"
