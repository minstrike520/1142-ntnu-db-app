packages:
  - 'frontend'
  - 'backend'

# Install-time lifecycle scripts run with full privileges, so they are the point
# where a compromised (or merely new) transitive dependency executes arbitrary
# code on a developer machine and in CI. The previous
# `dangerouslyAllowAllBuilds: true` granted that to every package in the graph;
# only `sharp` ever needed it, so the grant is now an explicit allowlist and
# adding a native dependency becomes a deliberate review step.
#
# `sharp` — `install: node install/check.js || npm run build` resolves or builds
# the libvips binding that avatar/attachment compression depends on.
onlyBuiltDependencies:
  - sharp

# Acknowledged as skipped rather than left unlisted, so `pnpm install` stays
# quiet and the decision is recorded instead of rediscovered.
#
# `unrs-resolver` — transitive via eslint-import-resolver-typescript. Its
# postinstall (`napi-postinstall`) only verifies that the platform's
# `@unrs/resolver-binding-*` package is present; the lockfile already resolves
# that binding as an optional dependency, so the script has nothing to do.
ignoredBuiltDependencies:
  - unrs-resolver

# hono 4.12.34 is the fix for GHSA-8j4g-w8fx-2239 and is younger than the
# default minimum release age. Waiting out the quarantine would leave the
# advisory unpatched and `security-scan` red, so this one version is excluded.
minimumReleaseAgeExclude:
  - hono@4.12.34

# pnpm honours `overrides` only at the workspace root. These were previously
# split across frontend/pnpm-workspace.yaml and backend/pnpm-workspace.yaml;
# consolidating to a single root lockfile requires merging them here, or the
# CVE pins silently stop applying and the `security-scan` CI job loses coverage.
#
# Deliberately NOT carried over from backend/: `vite: ^7.3.5` and
# `esbuild: ^0.28.1`. Both are leftovers from when the backend ran vitest — the
# backend declares neither today, and neither appears in its lockfile. At root
# scope they would apply only to the frontend, where vite resolves to 8.1.5;
# `^7.3.5` does not match 8.x, so hoisting that pin would force a major
# downgrade of the frontend toolchain rather than raise a security floor.
overrides:
  postcss: ">=8.5.23"
    # GHSA-fxqj-rqcc-2cmp affects <=8.5.22; the previous
    # ">=8.5.10" floor resolved 8.5.19 and was flagged
  ws: "^8.21.0" # was in both, identical; resolves 8.21.0
  "@babel/core": "^7.29.7"
    # was ^7.29.6 in frontend/, weaker than the ^7.29.7
    # already declared in frontend/package.json
  form-data: "^4.0.6" # was backend/
  socket.io-parser: "^4.2.7"
    # GHSA-2m8v-j782-fhvr affects >=4.0.0 <4.2.7.
    # Transitive via socket.io (backend) and
    # socket.io-client (both packages); neither
    # parent has released a bump yet, so pin here.
  # brace-expansion is reached through two incompatible major lines and each
  # needs its own floor — an unscoped pin would force one consumer onto the
  # other's major. Both lines carry GHSA-rgw5-rvv9-x895; the 1.x line also
  # carries GHSA-3jxr-9vmj-r5cp and GHSA-mh99-v99m-4gvg.
  #   1.x: eslint 9 -> minimatch@3, fixed in 1.1.18
  #   5.x: node-pg-migrate -> glob -> minimatch@10, fixed in 5.0.9
  "brace-expansion@<2": "^1.1.18"
  "brace-expansion@>=5": "^5.0.9"
