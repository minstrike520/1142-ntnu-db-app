<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#007aff" />
    <title>Near | Offline</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        background: #faf9fe;
        color: #1a1b1f;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
      }

      main {
        width: min(28rem, calc(100% - 2rem));
        box-sizing: border-box;
        padding: 2rem;
        border: 1px solid currentColor;
        border-radius: 4px;
        background: #ffffff;
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.5rem;
      }

      p {
        margin: 0 0 1.5rem;
        color: #717786;
        line-height: 1.5;
      }

      a {
        display: inline-block;
        padding: 0.625rem 1rem;
        border-radius: 4px;
        background: #007aff;
        color: #ffffff;
        font-weight: 600;
        text-decoration: none;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          background: #000000;
          color: #ffffff;
        }

        main {
          background: #000000;
        }

        p {
          color: #a1a1a6;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>Reconnect to the internet to continue using Near.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
