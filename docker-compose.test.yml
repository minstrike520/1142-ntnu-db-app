services:
  db-test:
    image: postgres:18-alpine
    ports:
      - "5436:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ntnu_test
    networks:
      - app_network
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 10

  # Named `redis-test`, not `redis`: this file resolves to the same compose
  # project (`near-chat`) as the dev stack, so a service called `redis` would be
  # the dev stack's Redis and a plain `docker compose up` would recreate it.
  # Publishes no host port — `db-test` only publishes 5436 because `migrate:test`
  # runs from the host, and the Redis-backed tests planned in #477 run through
  # `docker compose exec backend`.
  redis-test:
    image: redis:8-alpine
    networks:
      - app_network
    # Persistence off: a test Redis should start empty every time, and this also
    # avoids the anonymous /data volume the image's VOLUME declaration creates.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 2s
      timeout: 5s
      retries: 10

networks:
  app_network:
    external: true
    name: near-chat_network
