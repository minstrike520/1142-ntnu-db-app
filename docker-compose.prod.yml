services:
  db:
    image: postgres:18-alpine
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile.prod
    ports:
      - "4005:4000"
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=${PORT}
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
      - RATE_LIMIT_DISABLED=${RATE_LIMIT_DISABLED}
      - TRUST_PROXY=${TRUST_PROXY:-false}
      # The cloudflared container is the only proxy in front of this service, so
      # it is the only peer allowed to name the caller via CF-Connecting-IP /
      # X-Forwarded-For. Anything reaching the published 4005 port arrives with
      # a different peer address and stays pinned to that address' bucket.
      # Deliberately an exact address, never the network CIDR: the bridge
      # gateway lives in that range and is what every host-local caller looks
      # like, so a CIDR would let them pick their own bucket by header.
      # Shares TUNNEL_IP with the tunnel's static address below so the two can
      # never drift apart. Not read from .env under its own name, so the
      # documented .env cannot silently switch production off this behaviour.
      - TRUSTED_PROXY_IPS=${TUNNEL_IP:-10.83.71.250}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - ATTACHMENT_TYPE_RESTRICTION_ENABLED=${ATTACHMENT_TYPE_RESTRICTION_ENABLED:-false}
      - ATTACHMENT_ALLOWED_MIME_TYPES=${ATTACHMENT_ALLOWED_MIME_TYPES:-image/jpeg,image/png,image/gif,application/pdf,application/zip,text/plain}
      - ATTACHMENT_ALLOWED_EXTENSIONS=${ATTACHMENT_ALLOWED_EXTENSIONS:-.jpg,.jpeg,.png,.gif,.pdf,.zip,.txt}
      - ATTACHMENT_MAX_BYTES=${ATTACHMENT_MAX_BYTES:-10485760}
      - CI=true
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ${UPLOADS_MOUNT_SOURCE:-app_uploads}:/app/uploads

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile.prod
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    ports:
      - "3005:3000"
    environment:
      - NODE_ENV=${NODE_ENV}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - ALLOWED_DEV_ORIGINS=${ALLOWED_DEV_ORIGINS}
      - CI=true
    depends_on:
      - backend

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: always
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - frontend
      - backend
    networks:
      # Pinned so the backend can recognise this container as its proxy. Sits
      # high in the subnet, clear of the addresses Docker hands out from the
      # bottom. Override together with TUNNEL_SUBNET, never on its own.
      default:
        ipv4_address: ${TUNNEL_IP:-10.83.71.250}

networks:
  default:
    ipam:
      config:
        # Fixed so the tunnel's address is predictable. If this range collides
        # with an existing network on the host, `docker compose up` fails
        # loudly; set TUNNEL_SUBNET and TUNNEL_IP (in the same range) to move
        # it. An already-running stack must be taken down before the first up
        # with this configuration, otherwise Docker reports the pre-existing
        # network as having incorrect ipam configuration.
        - subnet: ${TUNNEL_SUBNET:-10.83.71.0/24}

volumes:
  pgdata:
  app_uploads:
