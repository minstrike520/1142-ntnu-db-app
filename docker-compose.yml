services:
  db:
    image: postgres:18-alpine
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      # Root context: this is a single-lockfile pnpm workspace, so the lockfile
      # and the other packages' manifests must be inside the build context.
      context: .
      dockerfile: ./backend/Dockerfile
    ports:
      - "4005:4000"
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=${PORT}
      - DATABASE_URL=${DATABASE_URL}
      # Pass through only when set on the host — no db-test default, because this
      # stack starts only `db`. Deliberately not `${DATABASE_URL_TEST:-}`: an
      # empty value still counts as set and would shadow backend/.env.test, which
      # is where the documented in-container test workflow gets this from.
      - DATABASE_URL_TEST
      - JWT_SECRET=${JWT_SECRET}
      - WS_TICKET_SECRET=${WS_TICKET_SECRET:-}
      - REALTIME_CURSOR_SECRET=${REALTIME_CURSOR_SECRET:-}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
      - RATE_LIMIT_DISABLED=${RATE_LIMIT_DISABLED}
      - TRUST_PROXY=${TRUST_PROXY:-false}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - ATTACHMENT_TYPE_RESTRICTION_ENABLED=${ATTACHMENT_TYPE_RESTRICTION_ENABLED:-false}
      - ATTACHMENT_ALLOWED_MIME_TYPES=${ATTACHMENT_ALLOWED_MIME_TYPES:-image/jpeg,image/png,image/gif,application/pdf,application/zip,text/plain}
      - ATTACHMENT_ALLOWED_EXTENSIONS=${ATTACHMENT_ALLOWED_EXTENSIONS:-.jpg,.jpeg,.png,.gif,.pdf,.zip,.txt}
      - ATTACHMENT_MAX_BYTES=${ATTACHMENT_MAX_BYTES:-10485760}
      - CI=true
    working_dir: /workspace/backend
    volumes:
      - ./backend:/workspace/backend
      # Uploads follow the working directory: src/utils/uploads.ts resolves them
      # as path.resolve(process.cwd(), "uploads"), and cwd is now the package.
      - ${UPLOADS_MOUNT_SOURCE:-app_uploads}:/workspace/backend/uploads
      # Preserve the package's symlink farm behind the bind mount above. The
      # real store lives at /workspace/node_modules/.pnpm and is left untouched
      # as image content — masking it would hide the packages these link to.
      - /workspace/backend/node_modules
      - ./tsconfig.base.json:/workspace/tsconfig.base.json:ro
      - ./shared:/workspace/shared:ro
      - ./package.json:/workspace/package.json:ro
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "pnpm run migrate:up && pnpm run dev"

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    ports:
      - "3005:3000"
    environment:
      - NODE_ENV=${NODE_ENV}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - ALLOWED_DEV_ORIGINS=${ALLOWED_DEV_ORIGINS}
      - CI=true
    working_dir: /workspace/frontend
    volumes:
      - ./frontend:/workspace/frontend
      - /workspace/frontend/node_modules
      # Keep the Next.js build cache off the bind-mounted host filesystem.
      - /workspace/frontend/.next
      - ./tsconfig.base.json:/workspace/tsconfig.base.json:ro
      - ./shared:/workspace/shared:ro
      - ./package.json:/workspace/package.json:ro
    depends_on:
      - backend

volumes:
  pgdata:
  app_uploads:

networks:
  default:
    name: near-chat_network
